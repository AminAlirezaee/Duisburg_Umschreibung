name: Termin Checker

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten (GitHub kann sich manchmal verspaeten)
  workflow_dispatch:          # manueller Start per Knopf (sendet eine Testnachricht)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_termin.py ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}
